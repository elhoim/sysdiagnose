name: Version & Release

# IMPORTANT: This workflow relies on branch protection rules to ensure
# code quality before releasing. The `main` branch MUST have required
# status checks enabled (codestyle + unittest must pass before merge).
# Without branch protection, broken code could be released.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python Semantic Release
        id: psr
        uses: python-semantic-release/python-semantic-release@v10
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          changelog: "false"

      - name: Generate release notes with git-cliff
        id: git-cliff
        if: steps.psr.outputs.released == 'true'
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose --latest --strip header
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update GitHub Release notes
        if: steps.psr.outputs.released == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.psr.outputs.version }}
          body: ${{ steps.git-cliff.outputs.content }}
          token: ${{ secrets.GITHUB_TOKEN }}
